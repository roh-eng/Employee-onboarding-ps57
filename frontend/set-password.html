<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password — Enterprise Workflow Hub</title>
    <style>
        :root { --primary:#0e7490; --primary2:#0369a1; --bg:#0b1220; --panel:#0f1b2d; --border:#1e3a52; --text:#e2e8f0; --muted:#94a3b8; --danger:#ef4444; --success:#10b981; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Inter,Arial,sans-serif;
               background:radial-gradient(1200px 600px at 70% -10%, #0e7490 0%, transparent 50%), var(--bg); color:var(--text); padding:24px; }
        .card { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
        h1 { margin:0 0 6px; font-size:1.4rem; }
        p.sub { margin:0 0 22px; color:var(--muted); font-size:.9rem; }
        label { display:block; font-size:.85rem; margin:14px 0 6px; color:var(--muted); }
        input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:#0b1626; color:var(--text); font-size:.95rem; }
        input:focus { outline:none; border-color:var(--primary); }
        button { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px; cursor:pointer; font-weight:700; font-size:.95rem;
                 color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary2)); }
        button:disabled { opacity:.6; cursor:not-allowed; }
        .msg { margin-top:16px; font-size:.88rem; padding:10px 12px; border-radius:8px; display:none; }
        .msg.err { display:block; background:rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.3); }
        .msg.ok { display:block; background:rgba(16,185,129,.12); color:#6ee7b7; border:1px solid rgba(16,185,129,.3); }
        .hint { color:var(--muted); font-size:.78rem; margin-top:6px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set your password</h1>
        <p class="sub">Create a password to activate your onboarding account.</p>
        <form id="form">
            <label>Email</label>
            <input id="email" type="email" autocomplete="username" readonly>
            <label>New password</label>
            <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
            <div class="hint">At least 8 characters.</div>
            <label>Confirm password</label>
            <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
            <button id="submit" type="submit">Set password</button>
        </form>
        <div id="msg" class="msg"></div>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const email = params.get('e') || '';
        const token = params.get('t') || '';
        document.getElementById('email').value = email;
        const msg = document.getElementById('msg');
        function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
        if (!email || !token) show('This link is missing its security token. Please use the link from your welcome email.', false);

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
            if (pw.length < 8) return show('Password must be at least 8 characters.', false);
            if (pw !== pw2) return show('Passwords do not match.', false);
            const btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Setting…';
            try {
                const res = await fetch('/api/auth/set-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword: pw })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { show(data.error || 'Could not set password.', false); btn.disabled = false; btn.textContent = 'Set password'; return; }
                show('Password set! Redirecting to login…', true);
                setTimeout(() => location.href = '/login.html', 1600);
            } catch (err) {
                show('Network error. Please try again.', false); btn.disabled = false; btn.textContent = 'Set password';
            }
        });
    </script>
</body>
</html>
