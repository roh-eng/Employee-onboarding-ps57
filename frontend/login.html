<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise Workflow Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="login-wrapper">
        <div class="login-card fade-in" style="max-width:460px;">
            <div class="login-logo">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h2 style="font-size:1.6rem;font-weight:700;margin-bottom:6px;">Welcome Back</h2>
            <p style="color:var(--text-muted);font-size:0.95rem;margin-bottom:28px;">Enterprise Workflow &amp; Delivery Intelligence</p>

            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:16px;text-align:left;">
                <i class="fa-solid fa-circle-info" style="color:var(--primary);"></i>
                Sign in with your <strong>ServiceNow PDI</strong> account. Access requires a valid
                ServiceNow user; your role is resolved automatically from ServiceNow.
            </p>

            <form id="login-form">
                <div class="form-group" style="text-align:left;">
                    <label>ServiceNow Username</label>
                    <input type="text" id="username" class="form-control" placeholder="your ServiceNow user name" required>
                </div>
                <div class="form-group" style="text-align:left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:16px;padding:14px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
                </button>
                <div id="login-error" style="color:#ef4444;font-size:0.85rem;margin-top:12px;display:none;text-align:center;"></div>
            </form>
            <div style="margin-top:24px;font-size:0.85rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:8px;">
                Secured by ServiceNow PDI <i class="fa-solid fa-shield-halved" style="color:var(--success);"></i>
            </div>
        </div>
    </div>

    <script>
        // Role is resolved entirely server-side from the user's ServiceNow
        // account (sys_user / sys_user_has_role) and returned in the signed JWT.
        // The client never chooses or influences the role.
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    // SECURITY: Always use the server-resolved role from the login response.
                    // The client-side role selector is informational only and MUST NOT
                    // override the role determined by ServiceNow. The role in the JWT
                    // (signed server-side) is the single source of truth.
                    const serverRole = data.role || 'employee';
                    localStorage.setItem('userRole', serverRole);
                    localStorage.setItem('userName', data.userName ||
                        (serverRole === 'hr' ? 'HR Manager' :
                         serverRole === 'manager' ? 'Project Manager' : 'Employee User')
                    );

                    // Cross-verify: decode the JWT to ensure the stored role matches
                    // the token-embedded role, preventing any client-side tampering.
                    try {
                        const tokenParts = data.token.split('.');
                        if (tokenParts.length === 3) {
                            const payload = JSON.parse(atob(tokenParts[1]));
                            if (payload.role && payload.role !== serverRole) {
                                // If there is a mismatch, the JWT role wins — it is
                                // cryptographically signed and cannot be forged.
                                localStorage.setItem('userRole', payload.role);
                            }
                        }
                    } catch (decodeErr) {
                        // If JWT decode fails, the server-provided role is still valid
                        console.warn('JWT decode verification skipped:', decodeErr.message);
                    }

                    window.location.href = 'index.html';
                } else {
                    throw new Error(data.error || 'Authentication failed.');
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
