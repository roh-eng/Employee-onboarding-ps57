<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise Workflow Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card fade-in">
            <div class="login-logo">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px;">Enterprise Workflow & Delivery Intelligence</p>
            
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label>Employee ID or Email</label>
                    <input type="text" id="username" class="form-control" placeholder="admin@enterprise.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 16px; padding: 12px;">
                    Sign In to Portal
                </button>
            </form>
            <div style="margin-top: 32px; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px;">
                Secured by ServiceNow <i class="fa-solid fa-shield-halved" style="color: var(--success);"></i>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        });
    </script>
</body>
</html>
