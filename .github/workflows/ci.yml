name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: |
          node --check backend/server.js
          node --check backend/routes/auth.js
          node --check backend/routes/employees.js
          node --check backend/routes/tasks.js
          node --check backend/routes/issues.js
          node --check backend/routes/projects.js
          node --check backend/routes/sprintTasks.js
          node --check backend/routes/menu.js
          node --check backend/routes/notifications.js
          node --check backend/routes/reports.js
          node --check backend/routes/webhooks.js
          node --check backend/routes/chat.js
          node --check backend/routes/stats.js
          node --check backend/routes/feedback.js

      - name: Start server in background
        run: node backend/server.js &
        env:
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: test-secret-key
          SERVICENOW_INSTANCE: https://example.service-now.com
          SERVICENOW_USERNAME: test
          SERVICENOW_PASSWORD: test
          SERVICENOW_SCOPE: x_test_scope

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Attempt $i: server not ready, waiting 2s..."
            sleep 2
          done

      - name: Run API tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          SERVICENOW_INSTANCE: https://example.service-now.com
          SERVICENOW_USERNAME: test
          SERVICENOW_PASSWORD: test
          SERVICENOW_SCOPE: x_test_scope

      - name: Build Docker image
        run: docker build -t enterprise-workflow-hub:test .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
